<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas DIY Advent</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4A35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Advent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E1D8; --surface:#F8F7F3; --ink:#1D2320; --muted:#5B625E; --line:#CFCABD;
  --stucco:#FBFAF5; --stucco-edge:#D6D1C4; --glass:#2B3440; --wire:#3B3B38;
  --brass:#B8902F; --brass-hi:#E2C574; --warm:#F5C76A;
  --oxblood:#6E1F24; --brunswick:#1F4A35;
  --focus:#1D5FD1;
  --serif:"Bodoni Moda","Bodoni 72",Didot,"Didot LT STD",Georgia,serif;
  --sans:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151E; --surface:#18202C; --ink:#ECE8DE; --muted:#9AA3AE; --line:#2A3443;
    --stucco:#2A3340; --stucco-edge:#1E2631; --glass:#0B0F15; --wire:#5A5F66;
    --brass:#C9A24A; --brass-hi:#EBD089; --focus:#7FB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#18202C; --ink:#ECE8DE; --muted:#9AA3AE; --line:#2A3443;
  --stucco:#2A3340; --stucco-edge:#1E2631; --glass:#0B0F15; --wire:#5A5F66;
  --brass:#C9A24A; --brass-hi:#EBD089; --focus:#7FB0FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}

/* Header */
.head h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.1rem,9vw,3rem);line-height:1.02;letter-spacing:-.01em}
.head h1 em{display:block;font-style:italic;font-size:.62em;color:var(--muted);letter-spacing:0}

/* Garland: one bulb per job */
.garland{margin:16px -8px 0}
.garland svg{width:100%;height:auto;display:block;overflow:visible}
.wire{fill:none;stroke:var(--wire);stroke-width:1.1}
.bulb .cap{fill:var(--wire)}
.bulb .glass{fill:var(--line);opacity:.9;transition:fill .4s}
.bulb.lit .glass{filter:url(#glow)}

.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:4px}
.stat b{font-family:var(--serif);font-weight:700;font-size:1.6rem;line-height:1;display:block;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* The one door */
.stage{display:flex;flex-direction:column;align-items:center;margin:26px 0 8px}
.door{position:relative;display:block;width:min(56vw,230px);padding:0;text-align:center}
.frame{display:block;background:var(--stucco);border:1px solid var(--stucco-edge);border-radius:4px 4px 2px 2px;padding:6px 6px 0;box-shadow:0 0 0 3px var(--brass)}
.fan{display:block;height:0;padding-bottom:42%;border-radius:999px 999px 0 0;background:var(--glass);position:relative;overflow:hidden;border:3px solid var(--stucco-edge);border-bottom-width:1px}
.fan::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from -90deg at 50% 100%,transparent 0 14deg,var(--stucco-edge) 14deg 16deg);opacity:.7}
.door.open .fan,.door.done .fan{background:radial-gradient(circle at 50% 100%,#FFE3A3,var(--warm) 55%,#C98A2E)}
.opening{display:block;position:relative;aspect-ratio:1/1.55;margin-top:3px;perspective:900px;background:linear-gradient(180deg,#FFE9B8,var(--warm) 60%,#D9973A)}
.inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3A2410;padding:0 10px}
.inside b{font-family:var(--serif);font-size:2.6rem;line-height:1;font-weight:700}
.inside span{font-size:.85rem;font-weight:600}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .8s cubic-bezier(.3,.7,.2,1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:block;background:var(--oxblood)}
.leaf::before,.leaf::after{content:"";position:absolute;left:16%;right:16%;border:1px solid rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.leaf::before{top:9%;height:24%}
.leaf::after{top:44%;height:46%}
.num{position:absolute;top:13%;left:0;right:0;z-index:1;font-family:var(--serif);font-weight:700;font-size:2.4rem;line-height:1;color:var(--brass-hi);font-variant-numeric:lining-nums}
.knob{position:absolute;right:11%;top:56%;width:10px;height:10px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.wreath{position:absolute;left:50%;top:60%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:6px solid #3C7A4E;box-shadow:inset 0 0 0 1px #1E4A2C}
.wreath::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;transform:translateX(-50%);background:#C8312B;border-radius:50%}
.door.open .leaf{transform:rotateY(-72deg)}
.step{display:block;height:7px;background:var(--stucco-edge);margin:0 -6px;border-radius:0 0 3px 3px}
.hint{margin-top:12px;font-size:.88rem;color:var(--muted)}
.bar{width:min(100%,320px);height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brunswick);transition:width .4s}

/* List */
.list[hidden]{display:none}
.group{margin-top:26px}
.group h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.55rem;line-height:1.1}
.group .note{font-size:.84rem;color:var(--muted);margin-top:2px}
.tasks{list-style:none;margin-top:8px}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check{width:26px;height:26px;flex:none;border-radius:6px;border:2px solid var(--brass);display:grid;place-items:center;transition:background .15s}
.check svg{width:15px;height:15px;opacity:0;transition:opacity .15s}
.task.done .check{background:var(--brass)}
.task.done .check svg{opacity:1}
.task input.t{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-size:1rem;outline:none}
.task input.t:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.task.done input.t{text-decoration:line-through;color:var(--muted)}
.del{width:32px;height:32px;flex:none;border-radius:50%;color:var(--muted);font-size:1.15rem}
.add{display:flex;gap:8px;margin-top:26px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:1rem}
.btn{border-radius:10px;padding:11px 16px;font-weight:600;font-size:.95rem;background:var(--brunswick);color:#F4F1E8}

.foot{margin-top:36px;font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;transition:opacity .2s,transform .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){ .leaf,.toast,.bar i{transition:none} }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>Christmas DIY Advent<em>one door, everything left before Christmas Day</em></h1>
  </header>

  <div class="garland" aria-hidden="true">
    <svg viewBox="0 0 360 52">
      <defs>
        <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="1.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path class="wire" id="wire" d="M4 8 Q 92 44 180 10 Q 268 44 356 8"/>
      <g id="bulbs"></g>
    </svg>
  </div>

  <div class="stats" id="stats"></div>

  <div class="stage">
    <button class="door" id="door" aria-expanded="false" aria-controls="list"></button>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <p class="hint" id="hint"></p>
  </div>

  <section class="list" id="list" hidden>
    <div id="groups"></div>
    <form class="add" id="addForm">
      <input id="addInput" placeholder="Add a job" autocomplete="off" enterkeyhint="done" aria-label="New job">
      <button class="btn">Add</button>
    </form>
  </section>

  <footer class="foot" id="syncNote">Saved on this device</footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const YEAR = 2026;
const LS_KEY = "diy_advent_v2";
const BULB_COLOURS = ["#E8483B","#F4C542","#3FA36B","#4A90D9","#F08A3C"];
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);

/* The jobs, in priority order for Christmas Day with family round. */
const GROUPS = [
  { id:"p1", name:"Your priorities", note:"Where everyone will be on the day. Start the alcove panels first, they're the biggest job",
    jobs:["Alcove cabinet panels","Replace front room light","Finish fitting extractor","Measure door frames","Plan bifold threshold","Fit bifold threshold"] },
  { id:"p2", name:"Next most visible", note:"Start the banister early, it needs drying time",
    jobs:["Scrape paint off window glass","Seal round window panes","Fit draft excluders","Strip banister","Paint and stain banister",
          "Plan bathroom threshold strip","Fit bathroom threshold strip","Plan backsplash","Fit backsplash"] },
  { id:"p3", name:"Quick wins", note:"Ten minutes each, good while paint dries",
    jobs:["Shower caddy","Hang mirror in study","Glue light in study"] },
  { id:"p4", name:"If time allows", note:"Otherwise after Christmas",
    jobs:["Paint imperfections in stairs","Paint step","Treat stairs","Plan under-stair shelves","Build under-stair shelves","Sockets and switches"] },
  { id:"add", name:"Added", note:"" }
];
function startingList(){
  return GROUPS.flatMap(g => (g.jobs || []).map(text => ({ id: uid(), text, done:false, group:g.id })));
}

/* ---------- state ----------
   Stored as the old calendar's day 1 so the Firestore rules (v, days, plan, updatedAt) still apply. */
function blank(){ return { v:4, days:{ 1:{ open:false, rest:false, tasks: startingList() } }, plan:false, updatedAt:0 }; }
// v4 replaces the 54-door calendar with the single prioritised list. Returns true if it changed s.
function migrate(s){
  if (!s || (s.v || 0) >= 4) return false;
  const b = blank(); s.v = 4; s.days = b.days; s.plan = false; return true;
}
let state = (() => {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.days) return s; } catch(e){}
  return blank();
})();
const box = () => state.days[1] || (state.days[1] = { open:false, rest:false, tasks:[] });
const tasks = () => box().tasks || (box().tasks = []);

/* ---------- persistence: device + Firebase (shared) ---------- */
let ref = null, writing = false, pending = false, timer = null;
function save(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (ref){ clearTimeout(timer); timer = setTimeout(push, 700); }
}
async function push(){
  if (!ref) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await ref.set(JSON.parse(JSON.stringify(state))); $("#syncNote").textContent = "Shared list, synced"; }
  catch(e){ $("#syncNote").textContent = "Saved on this device, will sync when back online"; }
  writing = false;
  if (pending){ pending = false; push(); }
}
if (migrate(state)) save();
(function(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !window.firebase){ $("#syncNote").textContent = "Saved on this device only"; return; }
  try {
    firebase.initializeApp(cfg);
    const db = firebase.firestore();
    try { db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); } catch(e){}
    const r = db.collection("calendar").doc(window.CALENDAR_ID);
    let first = true;
    r.onSnapshot(snap => {
      const remote = snap.exists ? snap.data() : null;
      if (first){
        first = false; ref = r;
        if (!remote){ push(); render(); return; }
      }
      if (!remote || !remote.days || remote.updatedAt === state.updatedAt) return;
      state = JSON.parse(JSON.stringify(remote));
      if (migrate(state)) save();
      else { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
      if (!document.activeElement.matches("#list input")) render(); else renderTop();
      $("#syncNote").textContent = "Shared list, synced";
    }, () => { $("#syncNote").textContent = "Saved on this device, sync not connected"; });
  } catch(e){ $("#syncNote").textContent = "Saved on this device only"; }
})();

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function counts(){ const t = tasks(); return { all: t.length, done: t.filter(x => x.done).length }; }

function renderGarland(){
  const g = $("#bulbs"), path = $("#wire"), ns = "http://www.w3.org/2000/svg";
  const { all, done } = counts(), len = path.getTotalLength();
  g.innerHTML = "";
  for (let i = 0; i < all; i++){
    const p = path.getPointAtLength(len * (i + .5) / all), lit = i < done;
    const el = document.createElementNS(ns, "g");
    el.setAttribute("class", "bulb" + (lit ? " lit" : ""));
    el.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${i % 2 ? 8 : -8})`);
    el.innerHTML = `<rect class="cap" x="-1.6" y="0" width="3.2" height="3" rx=".6"/>
      <ellipse class="glass" cx="0" cy="7.4" rx="2.9" ry="4.4" ${lit ? `style="fill:${BULB_COLOURS[i % BULB_COLOURS.length]}"` : ""}/>`;
    g.appendChild(el);
  }
}
function renderTop(){
  const { all, done } = counts(), left = all - done, open = !!box().open;
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const sleeps = Math.max(0, Math.round((new Date(YEAR, 11, 25) - today) / 86400000));
  $("#stats").innerHTML = `
    <div class="stat"><b>${done}/${all}</b><span>jobs done</span></div>
    <div class="stat"><b>${sleeps}</b><span>${sleeps === 1 ? "sleep" : "sleeps"} to Christmas</span></div>`;
  const door = $("#door");
  door.className = "door" + (open ? " open" : "") + (all && !left ? " done" : "");
  door.setAttribute("aria-expanded", open);
  door.setAttribute("aria-label", (open ? "Close the door" : "Open the door") + `, ${left} ${left === 1 ? "job" : "jobs"} left`);
  door.innerHTML = `<span class="frame"><span class="fan"></span><span class="opening">
      <span class="inside">${left ? `<b>${left}</b><span>${left === 1 ? "job" : "jobs"} left</span>` : `<b>★</b><span>All done. Merry Christmas</span>`}</span>
      <span class="leaf"><span class="num">25</span>${left ? '<span class="knob"></span>' : '<span class="wreath"></span>'}</span>
    </span><span class="step"></span></span>`;
  $("#barFill").style.width = all ? (100 * done / all) + "%" : "0";
  $("#hint").textContent = open ? "Tap the door to close it" : "Tap the door to see the jobs";
  $("#list").hidden = !open;
  renderGarland();
}
const CHECK_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>`;
function renderList(){
  const t = tasks();
  $("#groups").innerHTML = GROUPS.map(g => {
    const items = t.filter(x => (x.group || "add") === g.id);
    if (!items.length) return "";
    const left = items.filter(x => !x.done).length;
    return `<div class="group"><h2>${g.name}</h2>
      <p class="note">${left ? `${left} to do` : "All done"}${g.note ? `. ${g.note}` : ""}</p>
      <ul class="tasks">${items.map(x => `
        <li class="task${x.done ? " done" : ""}" data-id="${x.id}">
          <button class="check" aria-pressed="${!!x.done}" aria-label="Mark done">${CHECK_SVG}</button>
          <input class="t" value="${esc(x.text)}" aria-label="Job">
          <button class="del" aria-label="Delete job">×</button>
        </li>`).join("")}</ul></div>`;
  }).join("");
}
function render(){ renderTop(); renderList(); }

/* ---------- interactions ---------- */
$("#door").addEventListener("click", () => {
  box().open = !box().open; save(); renderTop();
  if (box().open) setTimeout(() => $("#list").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start" }), 450);
});
$("#groups").addEventListener("click", e => {
  const li = e.target.closest(".task"); if (!li) return;
  const t = tasks().find(x => x.id === li.dataset.id); if (!t) return;
  if (e.target.closest(".check")){
    t.done = !t.done; save(); render();
    const { all, done } = counts();
    if (t.done) toast(done === all ? "Everything done. Merry Christmas" : "Another bulb on the string");
  } else if (e.target.closest(".del")){
    box().tasks = tasks().filter(x => x !== t); save(); render(); toast("Job deleted");
  }
});
$("#groups").addEventListener("change", e => {
  if (!e.target.matches("input.t")) return;
  const li = e.target.closest(".task"), t = tasks().find(x => x.id === li.dataset.id); if (!t) return;
  const v = e.target.value.trim();
  if (v) t.text = v; else box().tasks = tasks().filter(x => x !== t);
  save(); render();
});
$("#groups").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input.t")) e.target.blur(); });
$("#addForm").addEventListener("submit", e => {
  e.preventDefault();
  const i = $("#addInput"), v = i.value.trim(); if (!v) { i.focus(); return; }
  tasks().push({ id: uid(), text: v, done:false, group:"add" });
  i.value = ""; save(); render(); i.focus();
});

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400);
}
setInterval(renderTop, 60000);   // keep the sleeps count right if left open overnight

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
