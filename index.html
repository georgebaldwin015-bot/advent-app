<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas DIY Advent</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4A35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Advent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E1D8; --surface:#F8F7F3; --ink:#1D2320; --muted:#5B625E; --line:#CFCAbd;
  --stucco:#FBFAF5; --stucco-edge:#D6D1C4; --glass:#2B3440; --wire:#3B3B38;
  --brass:#B8902F; --brass-hi:#E2C574; --warm:#F5C76A;
  --oxblood:#6E1F24; --brunswick:#1F4A35; --navy:#1D2C4A; --black:#1B1B1B; --teal:#3E5B5B;
  --focus:#1D5FD1;
  --serif:"Bodoni Moda","Bodoni 72",Didot,"Didot LT STD",Georgia,serif;
  --sans:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151E; --surface:#18202C; --ink:#ECE8DE; --muted:#9AA3AE; --line:#2A3443;
    --stucco:#2A3340; --stucco-edge:#1E2631; --glass:#0B0F15; --wire:#5A5F66;
    --brass:#C9A24A; --brass-hi:#EBD089; --focus:#7FB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#18202C; --ink:#ECE8DE; --muted:#9AA3AE; --line:#2A3443;
  --stucco:#2A3340; --stucco-edge:#1E2631; --glass:#0B0F15; --wire:#5A5F66;
  --brass:#C9A24A; --brass-hi:#EBD089; --focus:#7FB0FF;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}

/* Header */
.head h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.1rem,9vw,3rem);line-height:1.02;letter-spacing:-.01em}
.head h1 em{display:block;font-style:italic;font-size:.62em;color:var(--muted);letter-spacing:0}
.head p{color:var(--muted);font-size:.92rem;margin-top:8px}

/* Garland */
.garland{margin:18px -8px 6px;position:relative}
.garland svg{width:100%;height:auto;display:block;overflow:visible}
.wire{fill:none;stroke:var(--wire);stroke-width:1.1}
.bulb .cap{fill:var(--wire)}
.bulb .glass{fill:var(--line);opacity:.9;transition:fill .4s}
.bulb.lit .glass{filter:url(#glow)}
.bulb.today .ring{stroke:var(--ink);stroke-width:1;fill:none}
@media (prefers-reduced-motion:no-preference){
  .bulb.today .ring{animation:pulse 1.8s ease-in-out infinite}
}
@keyframes pulse{50%{opacity:.15}}

.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px}
.stat b{font-family:var(--serif);font-weight:700;font-size:1.6rem;line-height:1;display:block;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* Toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:500}
.toggle{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked + .track{background:var(--brunswick)}
.toggle input:checked + .track::after{transform:translateX(16px)}
.toggle input:focus-visible + .track{outline:2px solid var(--focus);outline-offset:2px}

/* Month */
.month{margin-top:26px}
.month h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.9rem;line-height:1;margin-bottom:12px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{font-size:.72rem;color:var(--muted);text-align:center;margin-bottom:6px}

/* Door */
.door{position:relative;display:block;width:100%;padding:0;text-align:center}
.frame{display:block;background:var(--stucco);border:1px solid var(--stucco-edge);border-radius:3px 3px 2px 2px;padding:3px 3px 0}
.fan{display:block;height:0;padding-bottom:42%;border-radius:999px 999px 0 0;background:var(--glass);position:relative;overflow:hidden;border:2px solid var(--stucco-edge);border-bottom-width:1px}
.fan::before{content:"";position:absolute;inset:0;background:
  repeating-conic-gradient(from -90deg at 50% 100%,transparent 0 16deg,var(--stucco-edge) 16deg 18deg) ;opacity:.7}
.door.lit .fan{background:radial-gradient(circle at 50% 100%,#FFE3A3,var(--warm) 55%,#C98A2E)}
.opening{display:block;position:relative;aspect-ratio:1/1.5;margin-top:2px;perspective:500px;background:linear-gradient(180deg,#FFE9B8,var(--warm) 60%,#D9973A)}
.inside{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:#3A2410;font-variant-numeric:tabular-nums}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.2,1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:block}
.leaf::before,.leaf::after{content:"";position:absolute;left:16%;right:16%;border:1px solid rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.leaf::before{top:10%;height:26%}
.leaf::after{top:46%;height:44%}
.c0{background:var(--oxblood)}.c1{background:var(--brunswick)}.c2{background:var(--navy)}.c3{background:var(--black)}.c4{background:var(--teal)}
.num{position:absolute;top:13%;left:0;right:0;z-index:1;font-family:var(--serif);font-weight:700;font-size:clamp(.82rem,3.6vw,1.05rem);line-height:1;color:var(--brass-hi);font-variant-numeric:lining-nums}
.knob{position:absolute;right:12%;top:58%;width:5px;height:5px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.wreath{position:absolute;left:50%;top:58%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #3C7A4E;box-shadow:inset 0 0 0 1px #1E4A2C}
.wreath::after{content:"";position:absolute;left:50%;bottom:-4px;width:6px;height:6px;transform:translateX(-50%);background:#C8312B;border-radius:50%}
.door.open .leaf{transform:rotateY(-108deg)}
.door.locked .leaf{filter:saturate(.55) brightness(.82)}
.door.locked .num{opacity:.7}
.door.today .frame{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.step{display:block;height:4px;background:var(--stucco-edge);margin:0 -3px;border-radius:0 0 2px 2px}
.door.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.blank{visibility:hidden}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  max-height:86vh;max-height:86dvh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:1.75rem;line-height:1.05}
.sheet .sub{color:var(--muted);font-size:.86rem;margin-top:4px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:1.2rem;line-height:1;flex:none}
.tasks{list-style:none;margin:18px 0 8px}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check{width:24px;height:24px;flex:none;border-radius:6px;border:2px solid var(--brass);display:grid;place-items:center;transition:background .15s}
.check svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.task.done .check{background:var(--brass)}
.task.done .check svg{opacity:1}
.task input.t{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-size:1rem;outline:none}
.task input.t:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.task.done input.t{text-decoration:line-through;color:var(--muted)}
.del{width:32px;height:32px;flex:none;border-radius:50%;color:var(--muted);font-size:1.15rem}
.empty{color:var(--muted);font-size:.92rem;padding:14px 0}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:1rem}
.btn{border-radius:10px;padding:11px 16px;font-weight:600;font-size:.95rem}
.btn-main{background:var(--brunswick);color:#F4F1E8}
.btn-quiet{border:1px solid var(--line);background:transparent}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .btn{flex:1 1 auto;font-weight:500;font-size:.88rem}
.rest-note{margin-top:16px;padding:14px;border-radius:10px;background:var(--bg);font-size:.92rem;color:var(--muted)}
.dup{padding:2px 0 12px 34px;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.dup b{color:var(--ink);font-weight:600}
.dup .dup-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dup button{border-radius:8px;padding:6px 12px;font-size:.84rem;font-weight:500;border:1px solid var(--line)}
.dup .dup-rm{background:var(--brunswick);border-color:var(--brunswick);color:#F4F1E8}
.task:has(+ .dup){border-bottom:0}
.bar-left{display:flex;flex-wrap:wrap;gap:8px}
#tidyBtn{border-color:var(--brass)}

/* Footer + toast */
.foot{margin-top:36px;display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted)}
.foot button{text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;transition:opacity .2s,transform .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .leaf,.sheet,.scrim,.toast{transition:none}
  .door.shake{animation:none}
}
@media (min-width:520px){ .wk,.grid{gap:9px} }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>Christmas DIY Advent<em>one door a day, house ready by Christmas Eve</em></h1>
    <p id="dateLine"></p>
  </header>

  <div class="garland" aria-hidden="true">
    <svg id="garland" viewBox="0 0 360 96">
      <defs>
        <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="1.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path class="wire" id="w1" d="M4 8 Q 92 44 180 10 Q 268 44 356 8"/>
      <path class="wire" id="w2" d="M4 54 Q 92 90 180 56 Q 268 90 356 54"/>
      <g id="bulbs"></g>
    </svg>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <div class="bar-left">
      <button class="chip" id="todayBtn">Go to today</button>
      <button class="chip" id="tidyBtn" hidden></button>
    </div>
    <label class="toggle">
      <input type="checkbox" id="planToggle">
      <span class="track"></span>
      Plan ahead
    </label>
  </div>

  <section id="months"></section>

  <footer class="foot">
    <span id="syncNote">Saved on this device</span>
    <button id="resetBtn">Clear all progress</button>
  </footer>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sheet-top">
    <div>
      <h3 id="sheetTitle"></h3>
      <div class="sub" id="sheetSub"></div>
    </div>
    <button class="x" id="closeBtn" aria-label="Close">×</button>
  </div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script>
const TOTAL = 54, YEAR = 2026;
const LS_KEY = "diy_advent_v2";
const BULB_COLOURS = ["#E8483B","#F4C542","#3FA36B","#4A90D9","#F08A3C"];
const $ = s => document.querySelector(s);

const dateFor = n => new Date(YEAR, 10, n);           // day 1 = 1 Nov; 31 rolls into 1 Dec
const fmtLong = d => d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = d => d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
function todayIndex(){
  const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t - new Date(YEAR,10,1)) / 86400000) + 1;
}
let TODAY = todayIndex();

/* ---------- state ---------- */
function blank(){ return { v:3, days:{}, plan:false, updatedAt:0 }; }
// v3: socket and switch tasks no longer name the room. Returns true if anything changed.
function migrate(s){
  if (!s || !s.days || (s.v || 0) >= 3) return false;
  for (const k in s.days) for (const t of (s.days[k].tasks || []))
    t.text = String(t.text).replace(/^Sockets: .+$/, "Socket").replace(/^Switches: .+$/, "Switch");
  s.v = 3; return true;
}
let state = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.days) return s;
    // migrate the original calendar's progress if present
    const old = JSON.parse(localStorage.getItem("diy_advent_progress"));
    if (old){
      const s2 = blank();
      for (const k in old){
        s2.days[k] = { open: !!old[k].open, rest: +k % 10 === 0,
          tasks: (old[k].tasks||[]).map(t => ({ id: uid(), text: t.text, done: !!(t.completed||t.done) })) };
      }
      return s2;
    }
  } catch(e){}
  return blank();
})();
function uid(){ return Math.random().toString(36).slice(2,9); }
function peek(n){ return state.days[n] || { open:false, rest:false, tasks:[] }; }
function day(n){ return state.days[n] || (state.days[n] = peek(n)); }
function isLocked(n){ return n > TODAY && !state.plan; }
function isComplete(n){ const d = peek(n); return d.rest ? d.open && n <= TODAY : d.tasks.length > 0 && d.tasks.every(t => t.done); }

/* ---------- persistence: device + Firebase (shared) ---------- */
let ref = null, writing = false, pending = false, timer = null;
function save(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (ref){ clearTimeout(timer); timer = setTimeout(push, 700); }
}
async function push(){
  if (!ref) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await ref.set(JSON.parse(JSON.stringify(state))); $("#syncNote").textContent = "Shared calendar, synced"; }
  catch(e){ $("#syncNote").textContent = "Saved on this device, will sync when back online"; }
  writing = false;
  if (pending){ pending = false; push(); }
}
/* ---------- spotting jobs you've done early ----------
   A task you added yourself (not one from the starting list) is compared with unfinished
   tasks on later days. Wording can differ: plurals, word order, filler words, small typos. */
const STOP = new Set("a an the and or of in on at to for with from up do get got my our some".split(" "));
function stem(w){
  if (w === "bannister") w = "banister";
  if (w === "shelves") return "shelf";
  if (w.length > 5 && w.endsWith("ing")) return w.slice(0, -3);
  if (w.length > 4 && /(ch|sh|x|ss)es$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
}
function words(s){
  return [...new Set(String(s).toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/)
    .filter(w => w && !STOP.has(w)).map(stem))];
}
function near(a, b){
  if (a === b) return true;
  if (a.length < 5 || b.length < 5 || Math.abs(a.length - b.length) > 1) return false;
  let prev = [...Array(b.length + 1).keys()];           // edit distance of at most 1
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length] <= 1;
}
function likeness(a, b){
  if (!a.length || !b.length) return 0;
  const hit = a.filter(x => b.some(y => near(x, y))).length;
  if (!hit) return 0;
  return .6 * Math.max(hit / a.length, hit / b.length) + .4 * (2 * hit / (a.length + b.length));
}
let SEED_IDS = new Set();
// Best later match for task t on day n, or null. On a tie the latest day wins, so repeated
// jobs (like Socket) come off the end of the plan and the finish date moves earlier.
function findMatch(n, t){
  if (t.dupChecked || SEED_IDS.has(t.id)) return null;
  const w = words(t.text); let best = null;
  for (let k = n + 1; k <= TOTAL; k++){
    const d = peek(k); if (d.rest) continue;
    for (const x of d.tasks){
      if (x.done) continue;
      const s = likeness(w, words(x.text));
      if (s >= .6 && (!best || s >= best.score)) best = { day: k, task: x, score: s };
    }
  }
  return best;
}
function dupCount(){
  let c = 0, first = 0;
  for (let n = 1; n <= TOTAL; n++) for (const t of peek(n).tasks) if (findMatch(n, t)){ c++; first = first || n; }
  return { c, first };
}
function finishDay(){
  for (let n = TOTAL; n >= 1; n--){ const d = peek(n); if (!d.rest && d.tasks.some(t => !t.done)) return n; }
  return 0;
}

function loadSeed(){
  try { return JSON.parse(decodeURIComponent(escape(atob(window.SEED.split("").reverse().join(""))))); } catch(e){ return null; }
}
(function(){
  const cfg = window.FIREBASE_CONFIG;
  const seed = window.SEED ? loadSeed() : null;
  if (seed) for (const k in seed.days) for (const t of seed.days[k].tasks) SEED_IDS.add(t.id);
  if (!state.updatedAt && seed){ seed.updatedAt = 1; state = JSON.parse(JSON.stringify(seed)); }
  if (migrate(state)) save();
  if (!cfg || !cfg.apiKey || !window.firebase){ $("#syncNote").textContent = "Saved on this device only"; return; }
  try {
    firebase.initializeApp(cfg);
    const db = firebase.firestore();
    try { db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); } catch(e){}
    const r = db.collection("calendar").doc(window.CALENDAR_ID);
    let first = true;
    r.onSnapshot(snap => {
      const remote = snap.exists ? snap.data() : null;
      if (first){
        first = false; ref = r;
        if (!remote){ push(); renderAll(); return; }
      }
      if (!remote || !remote.days || remote.updatedAt === state.updatedAt) return;
      state = JSON.parse(JSON.stringify(remote));
      if (migrate(state)) save();
      else { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
      renderStats(); renderGarland(); renderMonths(); $("#planToggle").checked = !!state.plan;
      if (active && !document.activeElement.matches("#sheet input")) renderSheet();
      $("#syncNote").textContent = "Shared calendar, synced";
    }, () => { $("#syncNote").textContent = "Saved on this device, sync not connected"; });
  } catch(e){ $("#syncNote").textContent = "Saved on this device only"; }
})();

/* ---------- garland ---------- */
function renderGarland(){
  const g = $("#bulbs"); g.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";
  [[$("#w1"),1],[$("#w2"),28]].forEach(([path, first]) => {
    const len = path.getTotalLength(), n = 27;
    for (let i = 0; i < n; i++){
      const dayN = first + i;
      const p = path.getPointAtLength(len * (i + .5) / n);
      const el = document.createElementNS(ns,"g");
      const lit = isComplete(dayN);
      el.setAttribute("class", "bulb" + (lit ? " lit" : "") + (dayN === TODAY ? " today" : ""));
      el.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${i % 2 ? 8 : -8})`);
      const colour = BULB_COLOURS[(dayN - 1) % BULB_COLOURS.length];
      el.innerHTML = `<rect class="cap" x="-1.6" y="0" width="3.2" height="3" rx=".6"/>
        <ellipse class="glass" cx="0" cy="7.4" rx="2.9" ry="4.4" ${lit ? `style="fill:${colour}"` : ""}/>
        <ellipse class="ring" cx="0" cy="7.4" rx="4.6" ry="6.2"/>`;
      g.appendChild(el);
    }
  });
}

/* ---------- stats ---------- */
function finishStat(){
  const f = finishDay();
  if (!f) return `<div class="stat"><b>Done</b><span>every job finished</span></div>`;
  const spare = TOTAL - f;
  return `<div class="stat"><b>${dateFor(f).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</b>
    <span>finish date${spare ? `, ${spare} ${spare === 1 ? "day" : "days"} spare` : ""}</span></div>`;
}
function renderStats(){
  let opened = 0, done = 0, all = 0, complete = 0;
  for (let n = 1; n <= TOTAL; n++){
    const d = peek(n); if (d.open) opened++;
    all += d.tasks.length; done += d.tasks.filter(t => t.done).length;
    if (isComplete(n)) complete++;
  }
  const xmas = new Date(YEAR, 11, 25);
  const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const left = Math.max(0, Math.round((xmas - t) / 86400000));
  $("#stats").innerHTML = `
    <div class="stat"><b>${complete}</b><span>of ${TOTAL} days finished</span></div>
    <div class="stat"><b>${done}/${all}</b><span>tasks done</span></div>
    <div class="stat"><b>${left}</b><span>${left === 1 ? "sleep" : "sleeps"} to Christmas</span></div>
    ${finishStat()}`;
  const dc = dupCount(), tb = $("#tidyBtn");
  tb.hidden = !dc.c; tb.dataset.day = dc.first;
  tb.textContent = `Tidy ${dc.c} duplicate${dc.c === 1 ? "" : "s"}`;
  const line = TODAY < 1 ? `The first door opens on ${fmtLong(dateFor(1))}.`
    : TODAY > TOTAL ? "Every door is open. Merry Christmas."
    : `Today is door ${TODAY}, ${fmtLong(dateFor(TODAY))}.`;
  $("#dateLine").textContent = line;
}

/* ---------- calendar ---------- */
function doorHTML(n){
  const d = peek(n), locked = isLocked(n);
  const cls = ["door"];
  if (d.open) cls.push("open");
  if (locked) cls.push("locked");
  if (n === TODAY) cls.push("today");
  if (d.open || n === TODAY) cls.push("lit");
  const doneCount = d.tasks.filter(t => t.done).length;
  const inside = d.rest ? "Rest" : d.tasks.length === 0 ? "+" : doneCount === d.tasks.length ? "✓" : `${doneCount}/${d.tasks.length}`;
  const label = `Door ${n}, ${fmtLong(dateFor(n))}` + (locked ? ", not open yet" : d.rest ? ", rest day" : `, ${doneCount} of ${d.tasks.length} tasks done`);
  return `<button class="${cls.join(" ")}" data-day="${n}" aria-label="${label}">
    <span class="frame">
      <span class="fan"></span>
      <span class="opening">
        <span class="inside">${inside}</span>
        <span class="leaf c${(n * 3) % 5}">
          <span class="num">${n}</span>
          ${d.rest ? '<span class="wreath"></span>' : '<span class="knob"></span>'}
        </span>
      </span>
      <span class="step"></span>
    </span>
  </button>`;
}
function renderMonths(){
  const months = [{name:"November", from:1, to:30},{name:"December", from:31, to:54}];
  $("#months").innerHTML = months.map(m => {
    const offset = (dateFor(m.from).getDay() + 6) % 7;
    let cells = "";
    for (let i = 0; i < offset; i++) cells += `<span class="blank"></span>`;
    for (let n = m.from; n <= m.to; n++) cells += doorHTML(n);
    return `<div class="month"><h2>${m.name}</h2>
      <div class="wk" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="grid">${cells}</div></div>`;
  }).join("");
}
function renderAll(){ renderStats(); renderGarland(); renderMonths(); $("#planToggle").checked = !!state.plan; }

$("#months").addEventListener("click", e => {
  const btn = e.target.closest(".door"); if (!btn) return;
  const n = +btn.dataset.day;
  if (isLocked(n)){
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
    toast(`Opens on ${fmtShort(dateFor(n))}. Turn on Plan ahead to add tasks now.`);
    return;
  }
  const d = day(n), wasOpen = d.open;
  if (!wasOpen){ d.open = true; save(); btn.classList.add("open","lit"); renderStats(); renderGarland(); }
  setTimeout(() => openSheet(n), wasOpen ? 0 : 320);
});

/* ---------- sheet ---------- */
let active = null, lastFocus = null;
const CHECK_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>`;
function openSheet(n){
  active = n; lastFocus = document.activeElement;
  renderSheet();
  $("#scrim").classList.add("show"); $("#sheet").classList.add("show");
  setTimeout(() => { const i = $("#addInput"); if (i && !peek(n).rest) i.focus({preventScroll:true}); else $("#closeBtn").focus(); }, 320);
}
function closeSheet(){
  $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show");
  if (active){ refreshDoor(active); renderStats(); renderGarland(); }
  active = null;
  if (lastFocus) lastFocus.focus({preventScroll:true});
}
function refreshDoor(n){
  const old = document.querySelector(`.door[data-day="${n}"]`); if (!old) return;
  const tmp = document.createElement("div"); tmp.innerHTML = doorHTML(n).trim();
  old.replaceWith(tmp.firstChild);
}
function renderSheet(){
  const n = active, d = day(n);
  $("#sheetTitle").textContent = fmtLong(dateFor(n));
  const doneCount = d.tasks.filter(t => t.done).length;
  $("#sheetSub").textContent = `Door ${n}` + (d.rest ? ", rest day" : d.tasks.length ? `, ${doneCount} of ${d.tasks.length} done` : "");
  let html = "";
  if (d.rest){
    html += `<div class="rest-note">No jobs today. Put the tools down.</div>`;
  } else {
    html += d.tasks.length
      ? `<ul class="tasks">${d.tasks.map(t => `
          <li class="task${t.done ? " done" : ""}" data-id="${t.id}">
            <button class="check" aria-pressed="${t.done}" aria-label="Mark done">${CHECK_SVG}</button>
            <input class="t" value="${esc(t.text)}" aria-label="Task">
            <button class="del" aria-label="Delete task">×</button>
          </li>${dupHTML(n, t)}`).join("")}</ul>`
      : `<p class="empty">Nothing planned yet. Add the first job below.</p>`;
    html += `<form class="add" id="addForm" onsubmit="return false">
        <input id="addInput" placeholder="Add a task, e.g. swap hallway switch" autocomplete="off" enterkeyhint="done">
        <button class="btn btn-main" id="addBtn">Add</button>
      </form>`;
  }
  const unfinished = d.tasks.filter(t => !t.done).length;
  html += `<div class="actions">
    ${!d.rest && unfinished && n < TOTAL ? `<button class="btn btn-quiet" id="carryBtn">Move ${unfinished} unfinished to tomorrow</button>` : ""}
    <button class="btn btn-quiet" id="restBtn">${d.rest ? "Make it a work day" : "Make it a rest day"}</button>
  </div>`;
  $("#sheetBody").innerHTML = html;
}
function dupHTML(n, t){
  const m = findMatch(n, t); if (!m) return "";
  return `<li class="dup" data-id="${t.id}">
    Also planned for ${fmtShort(dateFor(m.day))}: <b>${esc(m.task.text)}</b>
    <div class="dup-acts">
      <button class="dup-rm">Remove it there</button>
      <button class="dup-keep">Keep both</button>
    </div></li>`;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

$("#sheetBody").addEventListener("click", e => {
  const n = active, d = day(n);
  const li = e.target.closest(".task");
  const dup = e.target.closest(".dup");
  if (dup && e.target.closest("button")){
    const t = d.tasks.find(x => x.id === dup.dataset.id); if (!t) return;
    const m = findMatch(n, t);
    t.dupChecked = true;
    if (m && e.target.closest(".dup-rm")){
      const fd = day(m.day); fd.tasks = fd.tasks.filter(x => x !== m.task);
      refreshDoor(m.day);
      const f = finishDay();
      toast(`Removed from ${fmtShort(dateFor(m.day))}` + (f ? `. Finish date ${fmtShort(dateFor(f))}` : ". Everything's done"));
    }
    save(); renderSheet(); renderGarland(); renderStats();
  } else if (e.target.closest(".check") && li){
    const t = d.tasks.find(x => x.id === li.dataset.id); t.done = !t.done; save(); renderSheet();
    if (d.tasks.every(x => x.done)) toast("Door finished. Another bulb on the string.");
    renderGarland(); renderStats();
  } else if (e.target.closest(".del") && li){
    d.tasks = d.tasks.filter(x => x.id !== li.dataset.id); save(); renderSheet(); renderGarland(); renderStats();
  } else if (e.target.closest("#addBtn")){
    addTask();
  } else if (e.target.closest("#carryBtn")){
    const moving = d.tasks.filter(t => !t.done);
    d.tasks = d.tasks.filter(t => t.done);
    const next = day(n + 1); next.tasks.push(...moving.map(t => ({...t})));
    save(); refreshDoor(n + 1); renderSheet(); renderGarland(); renderStats();
    toast(`Moved ${moving.length} to ${fmtShort(dateFor(n + 1))}`);
  } else if (e.target.closest("#restBtn")){
    d.rest = !d.rest; save(); renderSheet(); renderGarland(); renderStats();
  }
});
$("#sheetBody").addEventListener("change", e => {
  if (!e.target.matches("input.t")) return;
  const li = e.target.closest(".task"), d = day(active);
  const t = d.tasks.find(x => x.id === li.dataset.id);
  const v = e.target.value.trim();
  if (v){ t.text = v; } else { d.tasks = d.tasks.filter(x => x !== t); renderSheet(); }
  save();
});
$("#sheetBody").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "addInput"){ e.preventDefault(); addTask(); }
  if (e.key === "Enter" && e.target.matches("input.t")) e.target.blur();
});
function addTask(){
  const i = $("#addInput"); const v = i.value.trim(); if (!v) { i.focus(); return; }
  day(active).tasks.push({ id: uid(), text: v, done: false });
  save(); renderSheet(); renderGarland(); renderStats();
  $("#addInput").focus();
}
$("#closeBtn").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && active) closeSheet(); });

/* ---------- toolbar ---------- */
$("#planToggle").addEventListener("change", e => {
  state.plan = e.target.checked; save(); renderMonths();
  toast(state.plan ? "Every door unlocked for planning" : "Future doors locked again");
});
$("#tidyBtn").onclick = () => { const n = +$("#tidyBtn").dataset.day; if (n) openSheet(n); };
$("#todayBtn").onclick = () => {
  const n = Math.min(Math.max(TODAY,1),TOTAL);
  const el = document.querySelector(`.door[data-day="${n}"]`);
  if (el){ el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}); el.focus({preventScroll:true}); }
};
$("#resetBtn").onclick = () => {
  if (!confirm("Clear every task and close all 54 doors? This can’t be undone.")) return;
  state = blank(); save(); renderAll(); toast("Calendar cleared");
};

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

// Roll over at midnight if the page stays open
setInterval(() => { const t = todayIndex(); if (t !== TODAY){ TODAY = t; renderAll(); } }, 60000);

renderAll();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
